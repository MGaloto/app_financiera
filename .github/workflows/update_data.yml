name: Dashboard Refresh

on: 
  push:
    branches: [main, master]
  schedule:
    # Lunes a viernes 22:30 UTC (19:30 hora Argentina): despues del cierre de
    # Wall Street todo el año (cierra 20:00 UTC en verano y 21:00 UTC en invierno),
    # asi los datos son del cierre completo del dia.
    - cron: '30 22 * * 1-5'

jobs:
  refresh-the-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      pages: write

    container: 
      image: mgaloto/flexdash_inversiones:02
    steps:
    - name: checkout_repo
      uses: actions/checkout@v3
      with: 
        ref: 'main'
    - name: Render Rmarkdown
      run: bash ./bash/extract_data.sh "MGaloto" "maxigaloto@hotmail.com"
