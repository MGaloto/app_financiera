name: Dashboard Refresh

on: 
  push:
    branches: [main, master]
  schedule:
    # GitHub usa hora UTC. Buenos Aires = UTC - 3 (sin horario de verano).
    # Se usa el minuto 17 y no el 00: a la hora en punto GitHub tiene mucha
    # carga y demora (o saltea) las corridas programadas.
    #
    # Mañana: 10:17 UTC = 07:17 Buenos Aires -> muestra el cierre del dia anterior.
    - cron: '17 10 * * 1-5'
    # Noche: 23:17 UTC = 20:17 Buenos Aires -> muestra el cierre del dia.
    # (Wall Street cierra 17:00 ARG con horario de verano de EE.UU. y 18:00 ARG sin el.)
    - cron: '17 23 * * 1-5'

jobs:
  refresh-the-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      pages: write

    container: 
      image: mgaloto/flexdash_inversiones:02
    steps:
    # Espera 20 segundos antes de bajar el repo: si en ese lapso se hace otro
    # commit (por ejemplo, subir dos archivos seguidos), esta corrida ya lo incluye.
    - name: esperar_20_segundos
      run: sleep 20
    - name: checkout_repo
      uses: actions/checkout@v3
      with: 
        ref: 'main'
    - name: Render Rmarkdown
      run: bash ./bash/extract_data.sh "MGaloto" "maxigaloto@hotmail.com"
